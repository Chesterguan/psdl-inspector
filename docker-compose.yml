# PSDL Inspector - Docker Compose
# Run: docker-compose up
# Access: http://localhost:9806

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8200:8200"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      # Terminology-anchoring (+ vocab search) engine. Default biolord_v2 = best
      # quality. The embedder model is baked into the image; the ~1.7GB BioLORD v2
      # index downloads on the FIRST anchor and is cached in the vocab_cache volume
      # below (one-time). Set this to "" (empty) to use the lighter legacy engine
      # instead — no 1.7GB download, lower quality.
      - ANCHORING_ENGINE=biolord_v2
      # Skip generation-time vocab enrichment (lower-quality legacy engine + a
      # second heavy cold-load). OMOP binding still happens at export anchoring.
      - GENERATE_SKIP_ENRICHMENT=1
    volumes:
      # Persist the ~1.7GB BioLORD v2 index so it's downloaded only once.
      - vocab_cache:/home/appuser/.cache/psdl_vocab_search
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8200/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "9806:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8200
    depends_on:
      - backend
    restart: unless-stopped

# Optional: Add if you want Ollama in the stack
#  ollama:
#    image: ollama/ollama:latest
#    ports:
#      - "11434:11434"
#    volumes:
#      - ollama_data:/root/.ollama
#    restart: unless-stopped

volumes:
  vocab_cache:        # BioLORD v2 index cache (one-time ~1.7GB download)
#  ollama_data:       # uncomment if you enable the optional ollama service above
